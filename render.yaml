# Render Blueprint — the designer deploys as two services.
#
# The React app is a static build (free and never sleeps), and the FastAPI
# backend is a web service, because validation and execution both live there.
# The frontend is given the API URL at build time; CRA inlines it into the
# bundle, so changing it requires a rebuild of the static site.
services:
  - type: web
    name: node-pipeline-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Both services are served from *.onrender.com, so allow that origin.
      - key: NPD_CORS_ORIGIN_REGEX
        value: https://.*\.onrender\.com

  - type: web
    name: node-pipeline-designer
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    envVars:
      # `fromService ... property: host` yields the bare service name here, not
      # the resolvable hostname, so the frontend ends up calling
      # https://node-pipeline-api. The full URL is set literally instead.
      - key: REACT_APP_API_URL
        value: https://node-pipeline-api.onrender.com
    routes:
      # Client-side routing: unknown paths fall back to the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
