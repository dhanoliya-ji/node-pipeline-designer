server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # A single-page app owns its own routing, so any unknown path has to fall
  # through to index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles are immutable; index.html must never be cached or a
  # deploy would not reach anyone still holding the old one.
  location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
