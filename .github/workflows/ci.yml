name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes whatever is already running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Verify the example pipelines still run
        working-directory: .
        run: python examples/build_examples.py

      - name: Check the working tree is unchanged
        working-directory: .
        run: git diff --exit-code

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          # Warnings are errors in CI: an unused import should not reach main.
          CI: true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -t npd-api ./backend

      - name: Build the frontend image
        run: docker build -t npd-web ./frontend

      - name: Smoke-test the API
        run: |
          docker run -d --name npd-api -p 8000:8000 npd-api
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy"
          docker logs npd-api
          exit 1
